      type: object
      additionalProperties: false
      required: [expectedRevision, channel, recipient, cadence, timeWib, weekday, topic, consent]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        channel: { type: string, enum: [slack, email] }
        recipient:
          type: string
          pattern: '^([CGUW][A-Z0-9]{8,30}|[A-Za-z0-9.!#$%&''*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+)$'
