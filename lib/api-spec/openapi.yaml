openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /lkt/report-cycles/{id}/findings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      operationId: getReportFindings
      tags: [LKT]
      responses:
        "200":
          description: Catatan temuan internal, termasuk arsip, khusus ruang tahun buku ini.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReportFinding" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createReportFinding
      tags: [LKT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportFindingInput" }
      responses:
        "201":
          description: Temuan tersimpan, tanpa mengubah checklist atau status regulasi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportFinding" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lkt/report-cycles/{id}/findings/{findingId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      - { name: findingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
    put:
      operationId: updateReportFinding
      tags: [LKT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportFindingUpdate" }
      responses:
        "200":
          description: Temuan diperbarui dan riwayat ditambahkan secara atomik.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportFinding" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /lkt/report-cycles/{id}/findings/{findingId}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      - { name: findingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      operationId: getReportFindingHistory
      tags: [LKT]
      responses:
        "200":
          description: Riwayat perubahan internal. Bukan bukti audit atau penelaahan independen.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReportFindingEvent" } }
        "404": { $ref: "#/components/responses/Error" }
  /lkt/consultation-specialists:
    get:
      operationId: getConsultationSpecialists
      tags: [LKT]
      responses:
        "200":
          description: Fokus bantuan dalam konsultasi bersama, tanpa pembelian atau aktivasi lisensi.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultationSpecialistProfile" }
  /lkt/report-cycles:
    get:
      operationId: getReportCycles
      tags: [LKT]
      responses:
        "200":
          description: Ruang laporan perusahaan terpilih, tanpa mengubah profil aktif.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReportCycle" } }
    post:
      operationId: createReportCycle
      tags: [LKT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCycleInput" }
      responses:
        "201":
          description: Ruang tahun buku dibuat; catatan checklist lama pada tahun yang sama tetap digunakan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCycleDetail" }
        "409": { description: Tahun buku sudah memiliki ruang laporan. }
  /lkt/report-cycles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: getReportCycle
      tags: [LKT]
      responses:
        "200":
          description: Checklist tahun terpilih dan diagnosis berbasis catatan pengguna.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCycleDetail" }
        "404": { description: Ruang tidak ditemukan dalam perusahaan terpilih. }
    put:
      operationId: updateReportCycle
      tags: [LKT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCycleUpdate" }
      responses:
        "200":
          description: Pengaturan ruang tersimpan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCycleDetail" }
        "409": { description: Pengaturan telah diubah anggota lain; muat ulang. }
  /lkt/report-cycles/{id}/tasks/{taskId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: taskId, in: path, required: true, schema: { type: string, minLength: 1 } }
    put:
      operationId: updateReportCycleTask
      tags: [LKT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistUpdate" }
      responses:
        "200":
          description: Status dan catatan tahun terpilih tersimpan; diagnosis dihitung ulang.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCycleDetail" }
        "404": { description: Ruang atau langkah tidak ditemukan. }
  /lkt/evidence-archives/{id}:
    get:
      operationId: getEvidenceArchive
      summary: Public curated evidence bytes, checksum-checked before serving
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200":
          description: Archived public evidence; not a new legal verification
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: Invalid identifier }
        "404": { description: Unknown archive }
        "503": { description: "Archive missing, corrupt or not linked to retained history" }
  /lkt/access-audit:
    get:
      operationId: getLktAccessAudit
      summary: Owner-only cursor-paginated access changes for the selected company, retained 90 days
      parameters:
        - in: query
          name: cursor
          description: Opaque nextCursor from the previous page. Invalid, expired or foreign-company cursors return 400.
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: action
          schema: { type: string, enum: [member_added, member_removed] }
        - in: query
          name: startDate
          description: Inclusive calendar day in Asia/Jakarta (WIB), YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - in: query
          name: endDate
          description: Inclusive calendar day in Asia/Jakarta (WIB), YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Access changes ordered by createdAt then id descending; excludes expired entries on every page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessAuditPage"
        "400":
          description: Invalid filter, date range, page size or cursor
        "401":
          description: Sign-in required
        "403":
          description: Current company owner required
  /lkt/account:
    get:
      operationId: getLktAccount
      responses:
        "200":
          description: Authenticated identity, memberships and availability of unclaimed legacy browser data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LktAccount" }
  /lkt/organizations:
    post:
      operationId: createLktOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: New company owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
  /lkt/organizations/{id}:
    delete:
      operationId: deleteLktOrganization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Owner deleted company and all associated application data
  /lkt/members:
    get:
      operationId: getLktMembers
      responses:
        "200":
          description: Members of the selected company
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMember" }
    post:
      operationId: addLktMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Owner granted access to an existing Clerk account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
  /lkt/members/{userId}:
    delete:
      operationId: removeLktMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Owner revoked access; owner cannot be removed
  /lkt/legacy:
    delete:
      operationId: deleteLktLegacy
      responses:
        "204":
          description: Delete unclaimed legacy data identified only by the signed browser cookie
  /lkt/reference-documents/setyorini-2007.pdf:
    get:
      operationId: downloadSetyoriniReference
      summary: Open the user-supplied 2007 academic article
      responses:
        "200":
          description: Original PDF served from persistent App Storage
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Reference PDF not found
  /lkt/company:
    get:
      operationId: getCompany
      responses:
        "200":
          description: Authorized company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInput" }
    put:
      operationId: saveCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInput" }
  /lkt/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Actual preparation progress, not legal compliance certification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /lkt/checklist:
    get:
      operationId: getChecklist
      responses:
        "200":
          description: Preparation tasks scoped to company and year
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChecklistItem" }
  /lkt/checklist/{id}:
    patch:
      operationId: updateChecklist
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItem" }
  /lkt/operator:
    get:
      operationId: getOperatorStatus
      responses:
        "200":
          description: Independent operator authority; never inferred from company roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorStatus"
        "401": { description: Authentication required }
  /lkt/operator/editorial-access:
    get:
      operationId: getEditorialAccess
      responses:
        "200":
          description: Active editors and latest 100 access events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialAccess" }
        "401": { description: Authentication required }
        "403": { description: Independent operator authority required }
    post:
      operationId: grantEditorialAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialAccessGrant" }
      responses:
        "200":
          description: Granted; existing grants unchanged without duplicate audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialAccessResult" }
        "400": { description: Invalid input or verified account not uniquely found }
        "401": { description: Authentication required }
        "403": { description: Independent operator authority required }
  /lkt/operator/editorial-access/revoke:
    post:
      operationId: revokeEditorialAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialAccessRevoke" }
      responses:
        "200":
          description: Revoked; journal attribution retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialAccessResult" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Independent operator authority required }
  /lkt/editorial:
    get:
      operationId: getEditorialWorkspace
      responses:
        "200":
          description: Account editorial permission, independent of company roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialWorkspace" }
  /lkt/editorial/references/{id}/events:
    post:
      operationId: appendEditorialEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialEventInput" }
      responses:
        "201":
          description: Immutable snapshot appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "400": { description: Invalid snapshot or calendar date }
        "401": { description: Authentication required }
        "403": { description: Editorial authorization required }
        "404": { description: Unknown reference }
        "409": { description: Stale revision; reload before retrying }
  /lkt/editorial/references/{id}/drafts:
    post:
      operationId: createEditorialDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialEventInput" }
      responses:
        "201":
          description: Private editorial draft saved, not published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDraft" }
        "400": { description: Invalid findings }
        "403": { description: Editor required }
        "404": { description: Unknown reference }
        "409": { description: Stale reference }
  /lkt/editorial/drafts/{id}:
    put:
      operationId: updateEditorialDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialDraftUpdate" }
      responses:
        "200":
          description: Author revised draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDraft" }
        "400": { description: Invalid findings }
        "403": { description: Active author required }
        "404": { description: Unknown draft }
        "409": { description: Stale draft or reference }
  /lkt/editorial/drafts/{id}/approve:
    post:
      operationId: approveEditorialDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialDraftApproval" }
      responses:
        "201":
          description: Exact draft published to append-only journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "400": { description: Invalid or expired review schedule }
        "403": { description: Different active editor required }
        "404": { description: Unknown draft }
        "409": { description: Stale draft or reference or already published }
  /lkt/access-notifications:
    get:
      operationId: getAccessNotifications
      tags: [lkt]
      responses:
        "200":
          description: Owner-only access notification preferences and recent delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessNotifications"
        "403": { description: Owner required }
    put:
      operationId: saveAccessNotifications
      tags: [lkt]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessNotificationInput"
      responses:
        "200":
          description: Opted in for future access changes only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessNotifications"
        "400": { description: Invalid recipient or missing consent }
        "403": { description: Owner required }
        "409": { description: Configuration changed or delivery in progress }
        "503": { description: Slack validation unavailable }
    delete:
      operationId: stopAccessNotifications
      tags: [lkt]
      responses:
        "200":
          description: Disabled and pending deliveries cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessNotifications"
        "403": { description: Owner required }
        "409": { description: Delivery in progress }
  /lkt/digest-email-consent:
    get:
      operationId: viewDigestEmailConsent
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, maxLength: 150 } }
      responses:
        "200":
          description: Public no-store HTML confirmation form; opening the link changes nothing.
          content:
            text/html:
              schema: { type: string }
        "400": { description: Invalid or revoked link }
        "503": { description: Consent signing unavailable }
    post:
      operationId: updateDigestEmailConsent
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DigestEmailConsentInput"
      responses:
        "200":
          description: Public no-store HTML result, no company data.
          content:
            text/html:
              schema: { type: string }
        "400": { description: Invalid or expired link }
        "403": { description: Authorizing owner no longer has access }
        "409": { description: Delivery busy; retry later }
        "503": { description: Consent signing unavailable }
  /lkt/reference-digest:
    get:
      operationId: getReferenceDigest
      tags: [lkt]
      responses:
        "200":
          description: Team schedule and recent deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDigest"
    put:
      operationId: saveReferenceDigest
      tags: [lkt]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceDigestInput"
      responses:
        "200":
          description: Schedule saved without sending a message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDigest"
        "400":
          description: Invalid configuration
        "403":
          description: Owner required
        "409":
          description: Stale revision
        "503":
          description: Slack unavailable
    delete:
      operationId: stopReferenceDigest
      tags: [lkt]
      responses:
        "200":
          description: Unsubscribed and pending retries cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDigest"
  /lkt/references:
    get:
      operationId: getReferences
      responses:
        "200":
          description: Reviewed references with bounded verification findings and primary evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reference" }
  /lkt/references/{id}/bookmark:
    put:
      operationId: bookmarkReference
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkInput" }
      responses:
        "200":
          description: Bookmarked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
  /lkt/problems:
    get:
      operationId: getProblems
      responses:
        "200":
          description: Educational troubleshooting guides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Problem" }
  /lkt/messages:
    get:
      operationId: getMessages
      parameters:
        - in: query
          name: before
          description: Opaque cursor from nextCursor; valid only in the authorized company.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 80, default: 80 }
      responses:
        "200":
          description: Newest page or older messages, ordered by createdAt then id ascending. Freshness is evaluated on every read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        "400":
          description: Invalid query or cursor; reload history to restart pagination.
    post:
      operationId: askConsultant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "200":
          description: AI answer with explicit limitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      operationId: clearMessages
      responses:
        "204":
          description: Consultation history deleted
  /lkt/activity:
    get:
      operationId: getActivity
      responses:
        "200":
          description: Recent activity in the authorized company workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Error:
      description: Permintaan tidak dapat diproses.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    ReportFindingInput:
      type: object
      required: [title, problem, cause, evidenceNeeded, actionPlan, actionResult, assignee, targetDate, priority, status, reviewNote]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        problem: { type: string, minLength: 1, maxLength: 5000 }
        cause: { type: string, maxLength: 3000 }
        evidenceNeeded: { type: string, maxLength: 3000 }
        actionPlan: { type: string, maxLength: 3000 }
        actionResult: { type: string, maxLength: 3000 }
        assignee: { type: string, maxLength: 150 }
        targetDate:
          oneOf:
            - { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            - { type: "null" }
        priority: { type: string, enum: [rendah, sedang, tinggi] }
        status: { type: string, enum: [terbuka, proses, menunggu_telaah, ditutup] }
        reviewNote: { type: string, maxLength: 3000 }
        sourceDiagnosisId:
          description: ID diagnosis yang disalin saat pembuatan; tidak menyinkronkan status.
          oneOf:
            - { type: string, maxLength: 100 }
            - { type: "null" }
    ReportFindingUpdate:
      type: object
      required: [expectedRevision, title, problem, cause, evidenceNeeded, actionPlan, actionResult, assignee, targetDate, priority, status, reviewNote, archived]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        problem: { type: string, minLength: 1, maxLength: 5000 }
        cause: { type: string, maxLength: 3000 }
        evidenceNeeded: { type: string, maxLength: 3000 }
        actionPlan: { type: string, maxLength: 3000 }
        actionResult: { type: string, maxLength: 3000 }
        assignee: { type: string, maxLength: 150 }
        targetDate:
          oneOf:
            - { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            - { type: "null" }
        priority: { type: string, enum: [rendah, sedang, tinggi] }
        status: { type: string, enum: [terbuka, proses, menunggu_telaah, ditutup] }
        reviewNote: { type: string, maxLength: 3000 }
        archived: { type: boolean }
    ReportFinding:
      type: object
      required: [id, reportCycleId, title, problem, cause, evidenceNeeded, actionPlan, actionResult, assignee, targetDate, priority, status, reviewNote, sourceDiagnosisId, archived, revision, createdAt, updatedAt, closedAt, closedByUserId]
      properties:
        id: { type: string }
