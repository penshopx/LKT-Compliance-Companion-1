openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /lkt/account:
    get:
      operationId: getLktAccount
      responses:
        "200":
          description: Authenticated identity, memberships and availability of unclaimed legacy browser data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LktAccount" }
  /lkt/organizations:
    post:
      operationId: createLktOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: New company owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
  /lkt/organizations/{id}:
    delete:
      operationId: deleteLktOrganization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Owner deleted company and all associated application data
  /lkt/members:
    get:
      operationId: getLktMembers
      responses:
        "200":
          description: Members of the selected company
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMember" }
    post:
      operationId: addLktMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Owner granted access to an existing Clerk account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
  /lkt/members/{userId}:
    delete:
      operationId: removeLktMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Owner revoked access; owner cannot be removed
  /lkt/legacy:
    delete:
      operationId: deleteLktLegacy
      responses:
        "204":
          description: Delete unclaimed legacy data identified only by the signed browser cookie
  /lkt/reference-documents/setyorini-2007.pdf:
    get:
      operationId: downloadSetyoriniReference
      summary: Open the user-supplied 2007 academic article
      responses:
        "200":
          description: Original PDF served from persistent App Storage
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Reference PDF not found
  /lkt/company:
    get:
      operationId: getCompany
      responses:
        "200":
          description: Authorized company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInput" }
    put:
      operationId: saveCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyInput" }
  /lkt/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Actual preparation progress, not legal compliance certification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /lkt/checklist:
    get:
      operationId: getChecklist
      responses:
        "200":
          description: Preparation tasks scoped to company and year
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChecklistItem" }
  /lkt/checklist/{id}:
    patch:
      operationId: updateChecklist
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItem" }
  /lkt/references:
    get:
      operationId: getReferences
      responses:
        "200":
          description: Reviewed references with bounded verification findings and primary evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reference" }
  /lkt/references/{id}/bookmark:
    put:
      operationId: bookmarkReference
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkInput" }
      responses:
        "200":
          description: Bookmarked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
  /lkt/problems:
    get:
      operationId: getProblems
      responses:
        "200":
          description: Educational troubleshooting guides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Problem" }
  /lkt/messages:
    get:
      operationId: getMessages
      responses:
        "200":
          description: Consultation history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: askConsultant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "200":
          description: AI answer with explicit limitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      operationId: clearMessages
      responses:
        "204":
          description: Consultation history deleted
  /lkt/activity:
    get:
      operationId: getActivity
      responses:
        "200":
          description: Recent activity in the authorized company workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Organization:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
    LktAccount:
      type: object
      required: [userId, organizations, legacyAvailable]
      properties:
        userId: { type: string }
        legacyAvailable: { type: boolean }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
    OrganizationInput:
      type: object
      required: [name, importLegacy, confirmLegacyOwnership]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        importLegacy: { type: boolean }
        confirmLegacyOwnership: { type: boolean }
    OrganizationMember:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { type: string, enum: [owner, member] }
    MemberInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string, minLength: 6, maxLength: 100, pattern: "^user_[A-Za-z0-9]+$" }
    CompanyInput:
      type: object
      required: [name, kind, year, standard]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        kind: { type: string, enum: [nonpublik, umkm, publik, kjpp] }
        year: { type: integer, minimum: 2020, maximum: 2100 }
        standard: { type: string, enum: [Belum ditentukan, SAK EMKM, SAK Entitas Privat, SAK Indonesia] }
    ChecklistItem:
      type: object
      required: [id, title, category, description, status, notes, scope]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string, enum: [belum, proses, selesai] }
        notes: { type: string }
        scope: { type: string }
    ChecklistUpdate:
      type: object
      required: [status, notes]
      properties:
        status: { type: string, enum: [belum, proses, selesai] }
        notes: { type: string, maxLength: 5000 }
    Reference:
      type: object
      required: [id, title, publisher, url, category, scope, summary, verified, bookmarked, verificationStatus, reviewedAt, sourceType, reportType, applicability, effectivePeriod, standards, verificationNotes, primarySources, editorialOwner, nextReviewAt, reviewOverdue, reviewHistory]
      properties:
        id: { type: string }
        title: { type: string }
        publisher: { type: string }
        url: { type: string }
        category: { type: string }
        scope: { type: string }
        summary: { type: string }
        verified:
          type: boolean
          description: True only for primary sources whose stated findings were checked, not a guarantee of current compliance or complete legal review.
        bookmarked: { type: boolean }
        editorialOwner:
          type: string
          description: Editorial role accountable for the next review; not a claim that a named person performed verification.
        nextReviewAt:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Next editorial review day in Asia/Jakarta; not a statutory deadline.
        reviewOverdue:
          type: boolean
          description: True after nextReviewAt has passed in Asia/Jakarta. Independent of verificationStatus and URL availability.
        reviewHistory:
          type: array
          items: { $ref: "#/components/schemas/ReferenceReviewEvent" }
        verificationStatus:
          type: string
          enum: [verified_primary, reviewed_secondary, outdated, needs_review, unavailable]
        reviewedAt:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: ISO calendar date of editorial review, not a timestamp or a claim that all provisions remain effective.
        sourceType: { type: string, enum: [primary, secondary] }
        reportType: { type: string, enum: [annual_report, financial_report, tax_return, mixed] }
        applicability: { type: string }
        effectivePeriod: { type: string }
        standards: { type: array, items: { type: string } }
        verificationNotes: { type: string }
        primarySources:
          type: array
          items: { $ref: "#/components/schemas/PrimaryEvidence" }
    ReferenceReviewEvent:
      type: object
      required: [recordedAt, editorialOwner, nextReviewAt, changeSummary, verificationStatus, verificationNotes, applicability, effectivePeriod, standards, primarySources]
      properties:
        recordedAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        editorialOwner: { type: string }
        nextReviewAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        changeSummary: { type: string }
        verificationStatus:
          type: string
          enum: [verified_primary, reviewed_secondary, outdated, needs_review, unavailable]
        verificationNotes: { type: string }
        applicability: { type: string }
        effectivePeriod: { type: string }
        standards: { type: array, items: { type: string } }
        primarySources:
          type: array
          items: { $ref: "#/components/schemas/PrimaryEvidence" }
    PrimaryEvidence:
      type: object
      required: [title, url, locator, finding]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        locator: { type: string }
        finding: { type: string }
    BookmarkInput:
      type: object
      required: [bookmarked]
      properties:
        bookmarked: { type: boolean }
    Problem:
      type: object
      required: [id, title, category, description, steps, referenceIds]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        steps: { type: array, items: { type: string } }
        referenceIds: { type: array, items: { type: string } }
    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string }
        referenceSnapshot:
          oneOf:
            - $ref: "#/components/schemas/ConsultationReferenceSnapshot"
            - type: "null"
        referenceFreshness:
          type: string
          enum: [current, changed, missing, not_applicable]
          description: Compared with current editorial metadata, not live web verification.
    ConsultationReferenceSnapshot:
      type: object
      required: [capturedAt, knowledgeVersion, references]
      properties:
        capturedAt: { type: string }
        knowledgeVersion: { type: string }
        references:
          type: array
          items:
            $ref: "#/components/schemas/ConsultationReferenceState"
    ConsultationReferenceState:
      type: object
      required: [id, title, reviewedAt, verificationStatus]
      properties:
        id: { type: string }
        title: { type: string }
        reviewedAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        verificationStatus:
          type: string
          enum: [verified_primary, reviewed_secondary, needs_review, outdated, unavailable]
    QuestionInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    Activity:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        createdAt: { type: string }
    Dashboard:
      type: object
      required: [total, completed, inProgress, progress, referenceCount, consultationCount, nextSteps]
      properties:
        total: { type: integer }
        completed: { type: integer }
        inProgress: { type: integer }
        progress: { type: integer }
        referenceCount: { type: integer }
        consultationCount: { type: integer }
        nextSteps: { type: array, items: { $ref: "#/components/schemas/ChecklistItem" } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

