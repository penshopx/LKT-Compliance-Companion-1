          description: Slack channel/user ID or one email address; server validates against channel.
        sender: { type: string, maxLength: 254, description: Required for email; verified Resend domain mailbox, no display name. }
        cadence: { type: string, enum: [daily, weekly] }
        timeWib: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        weekday: { type: integer, minimum: 0, maximum: 6, description: Sunday zero }
        consent: { type: boolean, enum: [true] }
        topic: { $ref: "#/components/schemas/ReferenceDigestTopic" }
